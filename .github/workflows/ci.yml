name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify build output
        run: |
          for f in dist/index.js dist/index.cjs dist/index.d.ts \
                   dist/element.js dist/element.cjs dist/element.d.ts \
                   dist/react.js dist/react.cjs dist/react.d.ts \
                   dist/vue.js dist/vue.cjs dist/vue.d.ts \
                   dist/folder-gallery.css; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Package contents
        run: npm pack --dry-run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
